<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- The game is dark and paints its own light surfaces (marble plates): dark-mode extensions would invert the type on them. -->
    <meta name="color-scheme" content="dark" />
    <meta name="darkreader-lock" />
    <title>disc</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;700&family=Grenze+Gotisch:wght@500;700&family=Inter:wght@400;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="stage"></div>
    <div id="battlehud" hidden>
      <div id="beam"><div id="turns"></div></div>
      <!-- One painted bar (assets/ui/battle/bar.webp, the hud-paint-in skill): the acting unit at its left end, the unit
           under the pointer at its right, the round and the commands in the middle. -->
      <div id="battlebar">
        <div id="cardleft" class="unitcard"></div>
        <div id="cardright" class="unitcard"></div>
        <div id="round"></div>
        <button id="resolve" class="knob"></button>
        <button id="auto" class="knob"></button>
        <button id="tarot-icon" class="knob"></button>
        <button id="unroll" class="knob" aria-label="Battle log"></button>
        <div id="actions"></div>
      </div>
      <div id="bottom"><div id="rules" hidden></div><div id="hint"></div></div>
      <div id="logstele" hidden><div id="log"></div></div>
    </div>
    <div id="banner" hidden></div>
    <div id="tarot" hidden></div>
    <div id="title" hidden></div>
    <div id="setup" hidden></div>
    <div id="newgame" hidden></div>
    <div id="codex" hidden></div>
    <div id="credits" hidden></div>
    <div id="menu" class="panel" hidden></div>
    <div id="peek" class="panel" hidden></div>
    <div id="maphud" hidden>
      <div id="mapcolumn">
        <div id="mapturn"></div>
        <button id="mapmenu" aria-label="Menu"></button>
        <div id="mapgold" class="plate"></div>
        <div id="mapmana" class="plate"></div>
        <div id="mapsquad"></div>
        <div id="mapcommands"></div>
        <div id="mapcity"></div>
        <button id="endturn" class="socket" aria-label="End turn"></button>
        <button id="mapspells" aria-label="Spell book"></button>
      </div>
      <div id="mapextra" class="panel" hidden></div>
      <div id="mapbottom"><div id="maphint"></div></div>
      <div id="mapbanner" hidden></div>
      <div id="capitol" class="screen" hidden></div>
      <div id="leaderscreen" class="screen" hidden></div>
      <div id="structurescreen" class="screen" hidden></div>
      <div id="forkprompt" class="panel" hidden></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
