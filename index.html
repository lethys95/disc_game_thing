<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>disc</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;700&family=Inter:wght@400;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="stage"></div>
    <div id="turns"></div>
    <div id="card" class="panel" hidden></div>
    <div id="log" class="panel"></div>
    <button id="auto" class="action" hidden>Auto-battle</button>
    <button id="resolve" class="action" hidden>Resolve now</button>
    <div id="bottom">
      <div id="hint"></div>
      <div id="actions"></div>
    </div>
    <div id="banner" hidden></div>
    <div id="tarot" hidden></div>
    <button id="tarot-icon" hidden></button>
    <div id="title" hidden></div>
    <div id="setup" hidden></div>
    <div id="newgame" hidden></div>
    <div id="codex" hidden></div>
    <div id="credits" hidden></div>
    <div id="menu" class="panel" hidden></div>
    <div id="maphud" hidden>
      <div id="mapturn"></div>
      <div id="mapsquad" class="panel"></div>
      <div id="mapcity" class="panel"></div>
      <div id="mapbottom"><div id="maphint"></div><button id="endturn" class="action">End turn</button></div>
      <button id="mapmenu" class="action">Menu</button>
      <div id="mapbanner" hidden></div>
      <div id="capitol" class="screen" hidden></div>
      <div id="leaderscreen" class="screen" hidden></div>
      <div id="structurescreen" class="screen" hidden></div>
      <div id="forkprompt" class="panel" hidden></div>
      <div id="peek" class="panel" hidden></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
